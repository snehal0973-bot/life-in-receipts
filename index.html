<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your Life, In Receipts</title><style>body{background:#111;display:flex;justify-content:center;padding:24px;font-family:monospace}.wrap{max-width:480px;width:100%;background:#fffaf0;padding-bottom:20px}.head{text-align:center;padding:28px;border-bottom:2px dashed #000}.fils{display:flex;gap:8px;padding:14px;flex-wrap:wrap;justify-content:center}.fils button{border:1px solid #000;background:#fff;padding:6px 14px;border-radius:20px;cursor:pointer}.fils button.active{background:#000;color:#fff}.list{padding:8px 18px}.item{padding:14px 0;border-bottom:1px dotted #aaa;cursor:pointer}.top{display:flex;justify-content:space-between;font-weight:700;font-size:11px}.mid{font-size:18px;margin:6px 0;font-weight:700}.bot{display:flex;justify-content:space-between;font-size:11px;opacity:.6}.box{margin:18px;background:#111;color:#fff;padding:14px}</style></head><body><div class="wrap"><div class="head"><h1>YOUR LIFE,<br>IN RECEIPTS</h1><p>FRONTEND ARENA - 20.09.2026 - SNEHAL #0420</p></div><div class="fils"><button class="active" onclick="show('all',this)">All</button><button onclick="show('music',this)">Music</button><button onclick="show('movie',this)">Movies</button><button onclick="show('place',this)">Places</button><button onclick="show('purchase',this)">Purchases</button></div><div class="list" id="list"></div><div class="box"><div>Total Memories: <span id="cnt">0</span></div></div></div><script>const D=[{cat:'music',t:'Lofi Chill - Spotify',d:'12 Sep',p:'1.2 HRS'},{cat:'purchase',t:'Chai & Bun Maska',d:'20 Sep - Pimpri',p:'Rs 45'},{cat:'movie',t:'Zindagi Na Milegi Dobara',d:'14 Sep',p:'Rewatched'},{cat:'place',t:'Fergusson College Road',d:'10 Sep',p:'Pune'},{cat:'purchase',t:'Blinkit Grocery Rs 847',d:'18 Sep',p:'Rs 847'},{cat:'music',t:'Channa Mereya',d:'19 Sep',p:'7x Repeat'},{cat:'purchase',t:'Metro Ticket PCMC',d:'20 Sep',p:'Rs 30'},{cat:'movie',t:'3 Idiots',d:'05 Sep',p:'Comfort Watch'},{cat:'place',t:'Shaniwar Wada',d:'08 Sep',p:'Weekend'}];function render(f){const L=document.getElementById('list');L.innerHTML='';const F=f==='all'?D:D.filter(o=>o.cat===f);document.getElementById('cnt').textContent=F.length+' RECEIPTS';F.forEach(o=>{const div=document.createElement('div');div.className='item';div.innerHTML='<div class="top"><span>'+o.cat+'</span><span>'+o.p+'</span></div><div class="mid">'+o.t+'</div><div class="bot"><span>'+o.d+'</span></div>';L.appendChild(div);});}function show(f,b){document.querySelectorAll('.fils button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(f);}render('all');</script></body></html>
